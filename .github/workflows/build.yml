name: 打包 Windows / Linux

# 打标签就出 release：git tag v0.2.0 && git push --tags
# 手动出包：Actions 页面点「Run workflow」
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 先体检再打包：带着 key 发版是没法挽回的，只能吊销。
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 扫描密钥泄露
        run: python tools/secret_scan.py .

  test:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python -m unittest discover -s tests

  build-windows:
    needs: [secret-scan, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pyyaml pillow
      - name: 打包
        run: pyinstaller --noconfirm --clean 砚.spec
      - name: 改名
        shell: bash
        # 用英文名：GitHub 的 Release 附件会吞中文字符（"砚.exe"变成"-Windows-x86_64.exe"）
        run: mv dist/砚.exe yan-Windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: yan-windows
          path: yan-Windows-x86_64.exe
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: yan-Windows-x86_64.exe

  build-linux:
    needs: [secret-scan, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 界面用的是 Tkinter：setup-python 的构建版大多自带，没自带时补上系统包
      - name: 确认 Tkinter 可用
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk || true
          python -c "import tkinter; print('tkinter ok', tkinter.TkVersion)"
      - run: pip install pyinstaller pyyaml pillow
      - name: 打包
        run: pyinstaller --noconfirm --clean 砚.spec
      - name: 改名
        run: |
          mv dist/砚 yan-Linux-x86_64
          chmod +x yan-Linux-x86_64
          # 不在 CI 里真的启动它：这是窗口程序，会挂住 runner。
          # 依赖是否齐全靠上面 import tkinter 那步 + 打包日志里的 missing 告警判断。
      - uses: actions/upload-artifact@v4
        with:
          name: yan-linux
          path: yan-Linux-x86_64
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: yan-Linux-x86_64
