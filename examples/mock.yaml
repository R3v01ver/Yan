# 零成本配置：全部用 Mock 代表，不需要任何 API key
# 用途：先验证流程是你要的，再换成真模型
# 运行：aiun deliberate "你的议题" --config examples/mock.yaml

max_rounds: 2
anonymize: true

chair:
  provider: mock
  model: mock-chair

delegates:
  - name: 代表A
    role: proposer
    provider: mock
    model: mock-a
  - name: 代表B
    role: adversary
    provider: mock
    model: mock-b
  - name: 代表C
    role: reviewer
    provider: mock
    model: mock-c

providers:
  mock: {type: mock}


